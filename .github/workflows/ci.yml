name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build dry run
    runs-on: [self-hosted, hz-ci-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
      - name: Pack (publish dry run)
        run: npm pack --dry-run

  ci-ok:
    runs-on: [self-hosted, hz-ci-light]
    needs: build
    steps:
      - run: echo "CI passed"
